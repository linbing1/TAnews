name: Daily Premier League Digest

on:
  schedule:
    - cron: '30 23 * * *'  # UTC 23:30 = Beijing 07:30
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run digest pipeline
        run: python main.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIO_ENABLED: ${{ vars.AUDIO_ENABLED }}
          AUDIO_VOICE: ${{ vars.AUDIO_VOICE }}
          AUDIO_KEEP_RELEASES: ${{ vars.AUDIO_KEEP_RELEASES }}
          ATHLETIC_COOKIES: ${{ secrets.ATHLETIC_COOKIES }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}

      - name: Run hot digest pipeline
        run: python main_hot.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIO_ENABLED: ${{ vars.AUDIO_ENABLED }}
          AUDIO_VOICE: ${{ vars.AUDIO_VOICE }}
          AUDIO_KEEP_RELEASES: ${{ vars.AUDIO_KEEP_RELEASES }}
          ATHLETIC_COOKIES: ${{ secrets.ATHLETIC_COOKIES }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          DIGEST_LINKS_FILE: /tmp/digest-links.json
