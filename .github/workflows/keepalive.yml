name: Keep Alive

on:
  schedule:
    - cron: '0 0 1 * *'  # 每月 1 号 UTC 00:00
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable daily workflow if disabled
        run: gh workflow enable daily.yml
        env:
          GH_TOKEN: ${{ github.token }}
