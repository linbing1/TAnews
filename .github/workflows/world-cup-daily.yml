name: Daily World Cup Digest

on:
  schedule:
    - cron: '0 4 * * *'  # UTC 04:00 = Beijing 12:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run World Cup digest pipeline
        run: python main_world_cup.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIO_ENABLED: ${{ vars.AUDIO_ENABLED }}
          AUDIO_VOICE: ${{ vars.AUDIO_VOICE }}
          AUDIO_KEEP_RELEASES: ${{ vars.AUDIO_KEEP_RELEASES }}
          ATHLETIC_COOKIES: ${{ secrets.ATHLETIC_COOKIES }}
          WORLD_CUP_PAGE_URL: ${{ vars.WORLD_CUP_PAGE_URL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
